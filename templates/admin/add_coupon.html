{% extends 'admin/base.html' %}
{% load static %}

{% block title %}
Add Coupon
{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'admin/css/products.css' %}">
{% endblock %}

{% block content %}

<div class="page-header">
    <div>
        <h3>Add Coupon</h3>
        <p>Create a new discount coupon</p>
    </div>
    <a href="{% url 'coupons' %}" class="btn btn-secondary">
        <i class="bi bi-arrow-left"></i>
        Back
    </a>
</div>

<div class="card shadow-sm">
    <div class="card-header">
        <h5>Coupon Information</h5>
    </div>

    <div class="card-body">
        <form method="POST">
            {% csrf_token %}
            <div class="row g-4">

                <!-- Coupon Code -->
                <div class="col-md-6">
                    <label class="form-label">
                        Coupon Code
                    </label>
                    <input
                        type="text"
                        name="code"
                        class="form-control"
                        placeholder="Enter coupon code"
                        required
                    >
                </div>

                <!-- Discount -->
                <div class="col-md-6">
                    <label class="form-label">
                        Discount Value
                    </label>
                    <input
                        type="number"
                        name="discount"
                        class="form-control"
                        placeholder="Enter discount"
                        min="0"
                        required
                    >
                </div>

                <!-- Discount Type -->
                <div class="col-md-6">
                    <label class="form-label">
                        Discount Type
                    </label>
                    <select name="discount_type" class="form-select">
                        <option value="percentage" selected>Percentage (%)</option>
                        <option value="fixed">Fixed Amount</option>
                    </select>
                </div>

                <!-- Status -->
                <div class="col-md-6">
                    <label class="form-label">
                        Status
                    </label>
                    <select name="status" class="form-select">
                        <option value="active" selected>Active</option>
                        <option value="inactive">Inactive</option>
                        <option value="expired">Expired</option>
                    </select>
                </div>

                <!-- Expiry Date -->
                <div class="col-md-6">
                    <label class="form-label">
                        Expiry Date
                    </label>
                    <input
                        type="date"
                        name="expiry_date"
                        class="form-control"
                    >
                </div>

                <!-- Buttons -->
                <div class="col-12">
                    <button
                        type="submit"
                        class="btn btn-primary"
                    >
                        <i class="bi bi-check-circle"></i>
                        Save Coupon
                    </button>

                    <a
                        href="{% url 'coupons' %}"
                        class="btn btn-secondary"
                    >
                        Cancel
                    </a>
                </div>

            </div>
        </form>
    </div>
</div>

{% endblock %}
